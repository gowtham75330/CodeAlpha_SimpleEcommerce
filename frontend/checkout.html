<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout · Hardware Desk</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><nav class="nav"><a class="brand" href="index.html"><span>Hardware Desk</span><small>useful tech, plainly chosen</small></a><button class="menu-toggle" type="button">Menu</button><div class="nav-links"><a href="index.html">Home</a><a class="cart-link active" href="cart.html">Cart <span class="cart-count" data-cart-count hidden>0</span></a><span data-auth-slot></span></div></nav></header><main><div class="page-head"><h1>Checkout</h1><p>Enter your shipping information to place the order.</p></div><div id="checkout-alert" class="alert" hidden></div><div class="checkout-layout"><form id="checkout-form" class="panel"><div class="form-grid"><div class="field"><label for="fullName">Full name</label><input id="fullName" name="fullName" maxlength="100" required></div><div class="field"><label for="phone">Phone</label><input id="phone" name="phone" maxlength="20" required></div></div><div class="field"><label for="address">Address</label><textarea id="address" name="address" rows="3" maxlength="220" required></textarea></div><div class="form-grid"><div class="field"><label for="city">City</label><input id="city" name="city" maxlength="80" required></div><div class="field"><label for="state">State / region</label><input id="state" name="state" maxlength="80" required></div></div><div class="field"><label for="postalCode">Postal code</label><input id="postalCode" name="postalCode" maxlength="20" required></div><button class="btn btn-primary btn-block" type="submit">Place order</button></form><aside id="checkout-summary" class="panel"></aside></div></main><footer class="site-footer"><div class="inner"><span>Hardware Desk</span><span>Secure order processing through the local API.</span></div></footer><div class="toast"></div><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/cart.js"></script><script src="js/checkout.js"></script></body></html>
